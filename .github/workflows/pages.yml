name: Equity valuation → Pages

# Lanza a mano (o desde la web, botón "Generar PDF"): el informe se publica en GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a valorar y publicar (p.ej. AAPL, JPM, O, XOM, SAN.MC)"
        required: true
        type: string
      profile:
        description: "Forzar perfil (auto = clasificación automática)"
        required: false
        type: choice
        default: "auto"
        options: ["auto", "standard", "bank", "insurance", "reit", "utility", "cyclical", "high_growth"]
      provider:
        description: "Fuente de datos"
        required: false
        type: choice
        default: "auto"
        options: ["auto", "fmp", "yfinance"]

# Necesario para que el workflow pueda commitear en /docs
permissions:
  contents: write

# Evita choques si lanzas varios a la vez
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # El ticker llega desde fuera (formulario de la web): se valida ANTES de tocar nada y
      # nunca se interpola dentro del script, solo se pasa como variable de entorno.
      - name: Validar entradas
        env:
          T: ${{ github.event.inputs.ticker }}
        run: |
          if ! [[ "$T" =~ ^[A-Za-z0-9.^=-]{1,12}$ ]]; then
            echo "::error::Ticker no válido: usa letras, números, punto o guion (máx. 12)"; exit 1
          fi
          echo "TICKER=${T^^}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: "pip"}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar motor de PDF (Chrome viene en el runner)
        run: google-chrome --version

      - name: Generate report into docs/reports
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PROFILE: ${{ github.event.inputs.profile }}
          PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          mkdir -p docs/reports
          ARGS=("$TICKER" --provider "$PROVIDER" --pdf --xlsx)
          if [ "$PROFILE" != "auto" ]; then ARGS+=(--profile "$PROFILE"); fi
          python valorar.py "${ARGS[@]}" \
            -o "docs/reports/${TICKER}.html" \
            --json "docs/reports/${TICKER}.json"

      - name: Rebuild index
        run: python scripts/build_index.py --docs docs

      - name: Commit & push to /docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "valuation: ${TICKER}" || echo "nothing to commit"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push

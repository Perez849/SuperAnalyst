name: Equity valuation (on-demand)

# Lanza a mano desde la pestaña Actions: eliges el ticker y los parámetros.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a valorar (p.ej. AAPL, JPM, O, XOM, SAN.MC)"
        required: true
        type: string
      profile:
        description: "Forzar perfil (vacío = auto-clasificado)"
        required: false
        type: choice
        default: "auto"
        options: ["auto", "standard", "bank", "insurance", "reit", "utility", "cyclical", "high_growth"]
      provider:
        description: "Fuente de datos"
        required: false
        type: choice
        default: "auto"
        options: ["auto", "fmp", "yfinance"]

jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar motor de PDF (Chrome viene en el runner)
        run: google-chrome --version

      - name: Validar entradas
        env:
          T: ${{ github.event.inputs.ticker }}
        run: |
          if ! [[ "$T" =~ ^[A-Za-z0-9.^=-]{1,12}$ ]]; then
            echo "::error::Ticker no válido"; exit 1
          fi
          echo "TICKER=${T^^}" >> "$GITHUB_ENV"

      - name: Run valuation
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}   # opcional; sin él usa yfinance
          PROFILE: ${{ github.event.inputs.profile }}
          PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          ARGS=("$TICKER" --provider "$PROVIDER" --pdf --xlsx --embed-fonts)
          if [ "$PROFILE" != "auto" ]; then ARGS+=(--profile "$PROFILE"); fi
          echo "Ejecutando: python valorar.py ${ARGS[*]}"
          python valorar.py "${ARGS[@]}" -o "${TICKER}_valuation.html"

      - name: Upload report (HTML + PDF)
        uses: actions/upload-artifact@v4
        with:
          name: valuation-${{ env.TICKER }}
          path: |
            *_valuation.html
            *_valuation.pdf
            *_valuation.xlsx
          retention-days: 90
